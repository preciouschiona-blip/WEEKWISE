name: Release WeekWise

# Publishes a signed APK on the Releases page whenever a version tag such as v1.0 is pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v1.0"
        required: true
        default: "v1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The KEYSTORE_BASE64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/weekwise-release.jks"

      - name: Check the signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "keystore bytes: $(stat -c %s "$RUNNER_TEMP/weekwise-release.jks") (expected 2604)"
          echo "alias length: ${#KEY_ALIAS} (expected 8), password length: ${#KEYSTORE_PASSWORD} (expected 24)"
          keytool -list -keystore "$RUNNER_TEMP/weekwise-release.jks" -storepass "$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')" || true

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/weekwise-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk WeekWise.apk
          gh release create "$TAG" WeekWise.apk \
            --target "$GITHUB_SHA" \
            --title "WeekWise $TAG" \
            --notes "Download WeekWise.apk on your Android phone and open it. Android will ask you to allow installs from your browser or Files app for this one install. See PRIVACY.md for what the app does with your data."
